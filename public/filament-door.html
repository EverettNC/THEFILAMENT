<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Filament</title>
<style>
  :root{ --ink:#04060a; --tiff:#2ff7ee; --wire:#7fe3ff; --catch:#8affc1;
         --dim:#4a5a6a; --paper:#dfe9f2; --hot:#f8ff2a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
    font:14px/1.5 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--ink)}
  #hud{position:fixed;top:18px;right:18px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;
    text-shadow:0 0 12px #000}
  .views{display:flex;gap:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .views a{color:var(--dim);text-decoration:none}
  .views a.on{color:var(--tiff)}
  #hud button{min-height:2.5rem;padding:0 1rem;border:1px solid var(--dim);background:transparent;color:var(--paper);
    font:12px inherit;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  #hud button[aria-pressed="true"], #hud button.on{border-color:var(--tiff);color:var(--tiff)}
  #btn{border-color:var(--wire);color:var(--wire)}
  #btn:disabled{opacity:.35;cursor:not-allowed}
  #st{font-size:11px;color:var(--dim);text-align:right}
  #st.on{color:var(--catch)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #mic{max-width:16rem;min-height:2.5rem;padding:0 .6rem;border:1px solid var(--dim);background:transparent;color:var(--paper);
    font:11px inherit}
  #level{width:10rem;height:6px;background:#1a222c;border:1px solid var(--dim)}
  #level>i{display:block;height:100%;width:0;background:var(--catch)}

  #as-said .unsure{color:var(--hot);border-bottom:1px dashed var(--hot)}
  #carbon{position:fixed;left:18px;top:auto;bottom:auto;z-index:19;display:none}
  #boards{position:fixed;left:18px;top:18px;z-index:20;max-width:20rem;max-height:38vh;overflow:auto;
    font-size:11px;color:var(--dim);text-shadow:0 0 12px #000}
  #boards section{margin-bottom:12px}
  #boards b{color:var(--hot);font-weight:400;letter-spacing:.14em;text-transform:uppercase}
  #boards li{margin:4px 0;color:var(--paper);list-style:none}
  #boards .hits{color:var(--dim)}

  #carbon b{color:var(--hot);font-weight:400;letter-spacing:.14em;text-transform:uppercase}
  #carbon li{margin:6px 0;color:var(--paper);list-style:none}
  #map{position:fixed;left:18px;bottom:18px;z-index:20;max-width:22rem;max-height:46vh;overflow:auto;
    font-size:11px;color:var(--paper);text-shadow:0 0 12px #000}
  #map b{display:block;margin-bottom:8px;color:var(--hot);font-weight:400;letter-spacing:.14em;text-transform:uppercase}
  #map label{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;color:var(--dim)}
  #map label.on{color:var(--paper)}
  #map input{accent-color:var(--tiff)}
  #region{max-width:18rem;text-align:right;color:var(--hot)}


</style>
</head>
<body>
<iframe id="stage" title="The Filament" src="/housing"></iframe>
<div id="hud">
  <nav class="views" aria-label="Filament view">
    <a href="/housing" data-view="/housing" class="on">Housing</a>
    <a href="/bare" data-view="/bare">Field</a>
    <a href="/live.html" data-view="/live.html">Live</a>
  </nav>
  <button id="train" type="button" aria-pressed="true">Train</button>
  <button id="speed" type="button">Speed 1×</button>
  <button id="speak" type="button" aria-pressed="true">Speak</button>
  <div class="st" id="region">training · Kentucky</div>
  <label class="sr" for="mic">Mic</label>
  <select id="mic" aria-label="Microphone">
    <option value="">default mic</option>
  </select>
  <button id="btn" type="button" disabled>Hold</button>
  <div id="level" aria-hidden="true"><i id="level-bar"></i></div>
  <div class="st" id="st">probing ear</div>
</div>
<div id="boards">
  <section>
    <b>Family board · Porch</b>
    <ul id="family-list"></ul>
  </section>
  <section>
    <b>Residual</b>
    <ul id="residual-list"></ul>
  </section>
</div>
<div id="carbon" hidden>
  <b>Carbon</b>
  <p>not sure. set aside.</p>
  <ul id="carbon-list"></ul>
</div>
<div id="map">
  <b>Dialect map</b>
</div>
<div id="as-said"></div>
<script src="/dialect-map.js"></script>
<script>
(function(){
  const EAR = location.port === '4850' ? '' : 'http://127.0.0.1:4850';
  const stage = document.getElementById('stage');
  const btn = document.getElementById('btn');
  const st = document.getElementById('st');
  const said = document.getElementById('as-said');
  const trainBtn = document.getElementById('train');
  const links = [...document.querySelectorAll('.views a')];
  window.filamentTrain = true;
  window.filamentMute = false;

  const mapBox = document.getElementById('map');
  const tour = window.FILAMENT_TOUR || [];
  const regions = window.FILAMENT_MAP || [];
  regions.forEach((pack) => {
    const lab = document.createElement('label');
    const on = !tour.length || tour.includes(pack.key);
    lab.className = on ? 'on' : '';
    lab.innerHTML = '<input type="checkbox" value="'+pack.key+'"'+(on?' checked':'')+'> '+pack.label;
    mapBox.appendChild(lab);
  });
  function selectedKeys(){
    return [...mapBox.querySelectorAll('input:checked')].map((el) => el.value);
  }
  function pushMap(){
    const keys = selectedKeys();
    [...mapBox.querySelectorAll('label')].forEach((lab) => {
      lab.classList.toggle('on', lab.querySelector('input').checked);
    });
    const w = frameWin();
    if (w && w.FILAMENT_SET_ENABLED) w.FILAMENT_SET_ENABLED(keys);
    if (window.FILAMENT_SET_ENABLED) window.FILAMENT_SET_ENABLED(keys);
  }
  mapBox.addEventListener('change', pushMap);

  const speakBtn = document.getElementById('speak');
  speakBtn.addEventListener('click', () => {
    window.filamentMute = !window.filamentMute;
    speakBtn.setAttribute('aria-pressed', window.filamentMute ? 'false' : 'true');
    const w = frameWin();
    if (w) w.filamentMute = window.filamentMute;
    if (window.filamentMute && window.speechSynthesis) window.speechSynthesis.cancel();
  });

  const SPEEDS = [0.6, 1, 2, 4];
  const SPEED_LABEL = { 0.6: "Slow", 1: "Speed 1×", 2: "Fast 2×", 4: "Rush 4×" };
  let speedIdx = 1;
  const speedBtn = document.getElementById('speed');
  function applySpeed(){
    const spd = SPEEDS[speedIdx];
    window.filamentSpeed = spd;
    if (window.FILAMENT_MAP) window.filamentSpeed = spd;
    const w = frameWin();
    if (w) w.filamentSpeed = spd;
    speedBtn.textContent = SPEED_LABEL[spd] || ("Speed "+spd+"×");
  }
  speedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    applySpeed();
  });

  function paintBoard(id, rows){
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = (rows||[]).slice(0,16).map((r) => {
      const said = r.said || r.keep || "";
      const hits = r.hits ? ' <span class="hits">×'+r.hits+'</span>' : '';
      const region = r.region ? ' · '+r.region : '';
      return '<li>'+said+hits+region+'</li>';
    }).join('') || '<li class="hits">empty</li>';
  }
  function pullBoard(){
    fetch(EAR+'/board').then(r=>r.json()).then((b) => {
      if (!b.ok) return;
      paintBoard('family-list', b.family);
      paintBoard('residual-list', b.residual);
    }).catch(()=>{});
  }
  function postBoard(bin, token, region, why){
    if (!token) return;
    fetch(EAR+'/board', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ bin, token, region, why }),
    }).then(() => pullBoard()).catch(()=>{});
  }
  pullBoard();
  setInterval(pullBoard, 4000);

  window.addEventListener('message', (ev) => {
    const data = ev.data || {};
    if (data.type === 'filament-caught') {
      postBoard('family', data.token, data.region, 'caught');
      return;
    }
    if (data.type === 'filament-slipped') {
      postBoard('residual', data.token, data.region, 'slipped');
      return;
    }
    if (data.type !== 'filament-token') return;
    const el = document.getElementById('region');
    if (el && data.region) el.textContent = 'training · ' + data.region;
    if (!window.filamentTrain || window.filamentMute) return;
    if (window.FILAMENT_SPEAK) window.FILAMENT_SPEAK(data.token, data.lang);
  });

  function frameWin(){
    try { return stage.contentWindow; } catch { return null; }
  }
  function catchTok(tok){
    const w = frameWin();
    if (w && typeof w.filamentCatch === 'function') w.filamentCatch(tok);
  }
  function setTrain(on){
    window.filamentTrain = on;
    trainBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    const w = frameWin();
    if (w) w.filamentTrain = on;
    if (on) {
      try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch (_e) {}
      pushMap();
      if (!window.filamentMute && window.FILAMENT_SPEAK) window.FILAMENT_SPEAK("training", "en-US");
    } else if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }
  }
  trainBtn.addEventListener('click', () => setTrain(window.filamentTrain === false));
  stage.addEventListener('load', () => {
    setTrain(window.filamentTrain !== false);
    pushMap();
    applySpeed();
  });
  setInterval(() => {
    const w = frameWin();
    const el = document.getElementById('region');
    if (el && w && w.filamentRegion) el.textContent = 'training · ' + w.filamentRegion;
  }, 400);

  links.forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const view = a.getAttribute('data-view');
      stage.src = view;
      links.forEach((x) => x.classList.toggle('on', x === a));
    });
  });

  function showSaid(text, partial, unsure){
    const s = String(text||'').trim();
    if(!s){ said.innerHTML=''; return; }
    const mark = (unsure && unsure.length)
      ? s.replace(/(\S+)/g, (tok) => {
          const hit = unsure.some((u) => (u.raw||u.text||'').toLowerCase() === tok.toLowerCase() || (u.text||'').toLowerCase()===tok.toLowerCase());
          return hit ? '<span class="unsure">'+tok+'</span>' : tok;
        }).replace(/<\/span> <span class="unsure">/g, ' ')
      : s;
    said.innerHTML = partial ? '<span class="partial">'+mark+'</span>' : mark;
  }
  function drawCarbon(aside){
    const box = document.getElementById('carbon');
    const list = document.getElementById('carbon-list');
    if(!box || !list) return;
    const rows = aside || [];
    box.hidden = rows.length === 0;
    list.innerHTML = rows.slice(0,12).map((r) => {
      const w = r.word || r.kept || '';
      const c = (r.conf!=null) ? Number(r.conf).toFixed(2) : '?';
      return '<li>'+w+' <span class="conf">'+c+'</span></li>';
    }).join('');
  }
  function pullCarbon(){
    fetch(EAR+'/carbon').then(r=>r.json()).then((b)=>{ if(b.ok) drawCarbon(b.aside); }).catch(()=>{});
  }
  pullCarbon();
  setInterval(pullCarbon, 2500);
  let listening=false, ctx, stream, proc, queue=Promise.resolve(), seen=0;
  function emit(text){
    const toks = String(text||'').trim().split(/\s+/).filter(Boolean);
    if(toks.length <= seen) return;
    for(let i=seen;i<toks.length;i++) catchTok(toks[i]);
    seen = toks.length;
    showSaid(toks.join(' '), true);
  }
  function downsample(input,inRate){
    const ratio=inRate/16000, n=Math.max(1,Math.floor(input.length/ratio)), out=new Int16Array(n);
    for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,input[Math.floor(i*ratio)]||0)); out[i]=s<0?s*0x8000:s*0x7fff; }
    return out;
  }
  function post(pcm,q){
    queue=queue.then(async()=>{
      const bytes = pcm.buffer.slice(pcm.byteOffset, pcm.byteOffset + pcm.byteLength);
      const res=await fetch(EAR+'/live'+(q||''),{method:'POST',headers:{'content-type':'application/octet-stream'},body:bytes});
      const body=await res.json();
      if(!body.ok){ st.textContent=body.error||'ear failed'; return; }
      if(body.final && body.text && body.text.trim()){
        emit(body.text);
        showSaid(body.text, false, body.unsure);
        seen=0;
        if(body.carbon) pullCarbon();
      } else {
        emit(body.partial||'');
        showSaid(body.partial||'', true, body.unsure);
      }
    });
    return queue;
  }
  fetch(EAR+'/health').then(r=>r.json()).then(h=>{
    if(h.seated){ st.textContent='seated · vosk · live'; st.classList.add('on'); btn.disabled=false; btn.textContent='Listen'; }
    else { st.textContent='unseated'; }
  }).catch(()=>{ st.textContent='unseated'; });

  const micSel = document.getElementById('mic');
  const levelBar = document.getElementById('level-bar');
  const WIRED = /usb|wired|external|interface|scarlett|focusrite|yeti|rode|wave|xlr|audio technica|behringer|zoom|tascam|motu|presonus|steinberg/i;
  const KEY = 'filament.mic';

  async function listMics(){
    if (!navigator.mediaDevices?.enumerateDevices) return;
    const all = await navigator.mediaDevices.enumerateDevices();
    const mics = all.filter((d) => d.kind === 'audioinput');
    const saved = localStorage.getItem(KEY) || '';
    const prefer = mics.find((d) => d.deviceId === saved) || mics.find((d) => WIRED.test(d.label)) || mics[0];
    micSel.innerHTML = mics.length
      ? mics.map((d) => `<option value="${d.deviceId}">${d.label || 'mic '+d.deviceId.slice(0,6)}</option>`).join('')
      : '<option value="">default mic</option>';
    if (prefer) micSel.value = prefer.deviceId;
  }
  listMics().catch(()=>{});
  navigator.mediaDevices?.addEventListener?.('devicechange', () => { listMics().catch(()=>{}); });
  micSel.addEventListener('change', () => localStorage.setItem(KEY, micSel.value));

  function constraints(){
    const deviceId = micSel.value;
    const audio = {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
    };
    if (deviceId) audio.deviceId = { exact: deviceId };
    return { audio };
  }

  async function start(){
    stream=await navigator.mediaDevices.getUserMedia(constraints());
    await listMics();
    const track = stream.getAudioTracks()[0];
    const label = track?.label || 'mic';
    localStorage.setItem(KEY, track?.getSettings?.().deviceId || micSel.value || '');
    ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    if(ctx.state==='suspended') await ctx.resume();
    const source=ctx.createMediaStreamSource(stream);
    proc=ctx.createScriptProcessor(4096,1,1);
    const meter=ctx.createAnalyser(); meter.fftSize=1024;
    const meterBuf=new Uint8Array(meter.fftSize);
    let carry=new Int16Array(0);
    listening=true; seen=0;
    const w = frameWin(); if (w) w.filamentLive = true;
    function pumpMeter(){
      if(!listening) return;
      meter.getByteTimeDomainData(meterBuf);
      let sum=0; for(let i=0;i<meterBuf.length;i++){ const v=(meterBuf[i]-128)/128; sum+=v*v; }
      const rms=Math.sqrt(sum/meterBuf.length);
      if(levelBar) levelBar.style.width = Math.min(100, Math.round(rms*220))+'%';
      requestAnimationFrame(pumpMeter);
    }
    proc.onaudioprocess=ev=>{
      if(!listening) return;
      const next=downsample(ev.inputBuffer.getChannelData(0), ctx.sampleRate);
      const merged=new Int16Array(carry.length+next.length); merged.set(carry); merged.set(next,carry.length);
      let off=0; while(merged.length-off>=8000){ post(merged.slice(off,off+8000)); off+=8000; }
      carry=merged.slice(off);
    };
    const mute=ctx.createGain(); mute.gain.value=0;
    source.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    source.connect(meter);
    pumpMeter();
    await post(new Int16Array(0),'?reset=1');
    btn.textContent='Stop'; st.textContent='hearing · '+label; st.classList.add('on');
  }
  async function stop(){
    listening=false;
    const w = frameWin(); if (w) w.filamentLive = false;
    proc&&proc.disconnect(); stream&&stream.getTracks().forEach(t=>t.stop()); ctx&&ctx.close();
    proc=stream=ctx=null; if(levelBar) levelBar.style.width='0';
    await post(new Int16Array(0),'?end=1');
    btn.textContent='Listen'; st.textContent='seated · vosk · live';
  }
  btn.addEventListener('click',()=>{ listening?stop().catch(()=>{}):start().catch((err)=>{ st.textContent = (err && err.name==='NotFoundError') ? 'no mic found' : 'mic denied'; }); });
})();
</script>
</body>
</html>
